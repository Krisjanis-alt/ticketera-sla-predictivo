<div class="dashboard-container">
  <div class="card form-card">
    <h2>Evaluación de SLA</h2>
    <p class="subtitle">Ingrese los datos del ticket para predecir el riesgo de incumplimiento del SLA.</p>
    
    <form [formGroup]="predictionForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="Categoria">Categoría del Ticket</label>
        <input id="Categoria" type="text" formControlName="Categoria" placeholder="Ej. Hardware, Software, Redes">
      </div>

      <div class="form-group">
        <label for="Prioridad">Prioridad</label>
        <select id="Prioridad" formControlName="Prioridad">
          <option value="" disabled selected>Seleccione una prioridad</option>
          <option value="Baja">Baja</option>
          <option value="Media">Media</option>
          <option value="Alta">Alta</option>
          <option value="Critica">Crítica</option>
        </select>
      </div>

      <div class="form-group">
        <label for="Seniority">Seniority del Agente</label>
        <select id="Seniority" formControlName="Seniority">
          <option value="" disabled selected>Seleccione el seniority</option>
          <option value="Trainee">Trainee</option>
          <option value="Junior">Junior</option>
          <option value="Semi-Senior">Semi-Senior</option>
          <option value="Senior">Senior</option>
        </select>
      </div>

      <div class="form-group">
        <label for="Hora_Creacion">Hora de Creación</label>
        <input id="Hora_Creacion" type="number" formControlName="Hora_Creacion" min="0" max="23" placeholder="0 - 23 horas">
      </div>

      <div class="form-group">
        <label for="Dia_Semana">Día de la Semana</label>
        <select id="Dia_Semana" formControlName="Dia_Semana">
          <option value="" disabled selected>Seleccione el día</option>
          <option value="Lunes">Lunes</option>
          <option value="Martes">Martes</option>
          <option value="Miércoles">Miércoles</option>
          <option value="Jueves">Jueves</option>
          <option value="Viernes">Viernes</option>
          <option value="Sábado">Sábado</option>
          <option value="Domingo">Domingo</option>
        </select>
      </div>

      <div class="form-group">
        <label for="Tiempo_Resolucion_hrs">Tiempo de Resolución (horas)</label>
        <input id="Tiempo_Resolucion_hrs" type="number" step="0.5" formControlName="Tiempo_Resolucion_hrs" min="0.5" placeholder="Ej. 4.5">
      </div>

      <button type="submit" [disabled]="predictionForm.invalid || loading">
        {{ loading ? 'Consultando modelo...' : 'Evaluar Riesgo' }}
      </button>

    </form>
  </div>

  <div class="card result-card" *ngIf="result" 
       [ngClass]="{
         'risk-low': result.riesgo === 'Bajo', 
         'risk-medium': result.riesgo === 'Medio', 
         'risk-high': result.riesgo === 'Alto'
       }">
    <h3>Resultado de Predicción</h3>
    <div class="result-details">
      <div class="metric">
        <span class="label">Nivel de Riesgo</span>
        <span class="value">{{ result.riesgo }}</span>
      </div>
      <div class="metric">
        <span class="label">Probabilidad de Incumplimiento</span>
        <span class="value">{{ result.probabilidad }}%</span>
      </div>
    </div>
    
    <div class="shap-chart-container" *ngIf="result.explicacion_shap && result.explicacion_shap.length > 0" style="margin-top: 20px; display: block;">
      <canvas baseChart
        [data]="barChartData"
        [options]="barChartOptions"
        [type]="barChartType">
      </canvas>
    </div>
  </div>

  <div class="card error-card" *ngIf="error">
    {{ error }}
  </div>
</div>
